<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR 34713 — случай 2: filter и sort ресурса</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #222;
        background: #fff;
      }

      .page { max-width: 1500px; margin: 0 auto; }

      h1 { font-size: 17px; margin: 0 0 14px; }
      h2 { font-size: 14px; margin: 22px 0 8px; }

      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-items: start;
      }

      @media (max-width: 1100px) {
        .cols { grid-template-columns: 1fr; }
      }

      .panel {
        border: 1px solid #d8d8d8;
        border-radius: 6px;
        padding: 10px;
        background: #fcfcfc;
      }

      .panel.fail { border-color: #d9534f; }
      .panel.pass { border-color: #5cb85c; }

      .panel h3 {
        font-size: 13px;
        margin: 0 0 8px;
        font-weight: 600;
      }

      .panel.fail h3 { color: #b02a25; }
      .panel.pass h3 { color: #3d8b3d; }

      iframe {
        width: 100%;
        height: 560px;
        border: 0;
        background: #fff;
      }

      .codewrap { position: relative; margin-top: 6px; }

      pre {
        background: #f7f7f8;
        border: 1px solid #e2e2e4;
        border-radius: 5px;
        padding: 12px;
        overflow-x: auto;
        font-family: 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12.5px;
        line-height: 1.45;
        margin: 0;
      }

      .copy {
        position: absolute;
        top: 8px;
        right: 8px;
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        border: 1px solid #c9c9cc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }

      .copy:hover { background: #f0f0f2; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>PR 34713 — случай 2</h1>

      <div class="cols">
        <div class="panel fail">
          <h3>не проходит — встреча без roomId</h3>
          <iframe src="./frame.html?v=fail" title="не проходит"></iframe>
        </div>
        <div class="panel pass">
          <h3>проходит — встреча с roomId: 11</h3>
          <iframe src="./frame.html?v=pass" title="проходит"></iframe>
        </div>
      </div>

      <h2>не проходит</h2>
      <div class="codewrap">
        <button class="copy" data-target="code-fail">Копировать</button>
        <pre><code id="code-fail"></code></pre>
      </div>

      <h2>проходит</h2>
      <div class="codewrap">
        <button class="copy" data-target="code-pass">Копировать</button>
        <pre><code id="code-pass"></code></pre>
      </div>
    </div>

    <script src="./code.js"></script>
    <script>
      document.getElementById('code-fail').textContent = window.DEMO_CODE.fail;
      document.getElementById('code-pass').textContent = window.DEMO_CODE.pass;

      document.querySelectorAll('.copy').forEach((button) => {
        button.addEventListener('click', () => {
          const text = document.getElementById(button.dataset.target).textContent;
          navigator.clipboard.writeText(text).then(
            () => {
              button.textContent = 'Скопировано';
              setTimeout(() => { button.textContent = 'Копировать'; }, 1500);
            },
            () => { button.textContent = 'Не вышло'; },
          );
        });
      });
    </script>
  </body>
</html>
