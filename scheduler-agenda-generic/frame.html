<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Agenda + группировка по ресурсам</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  var params = new URLSearchParams(location.search);
  var theme = /^[a-z0-9.]+$/.test(params.get('theme') || '') ? params.get('theme') : 'light';
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://cdn3.devexpress.com/jslib/26.1.3/css/dx.' + theme + '.css';
  document.head.appendChild(link);
</script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn3.devexpress.com/jslib/26.1.3/js/dx.all.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
</style>
</head>
<body class="dx-surface">
  <div id="scheduler"></div>
  <script>
    var fix = new URLSearchParams(location.search).get('fix') === '1';

    if (fix) {
      var style = document.createElement('style');
      style.textContent = [
        '.dx-scheduler-agenda .dx-scheduler-group-header-content {',
        '  box-shadow: none;',
        '  width: auto;',
        '}',
        '.dx-scheduler-agenda .dx-scheduler-group-header {',
        '  box-shadow: inset 0 -1px 0 0 rgb(195.5, 195.5, 195.5);',
        '}',
      ].join('\n');
      document.head.appendChild(style);
    }

    $(function () {
      $('#scheduler').dxScheduler({
        currentDate: new Date(2018, 4, 14),
        currentView: 'agenda',
        views: ['agenda'],
        startDayHour: 9,
        height: 480,
        groups: ['roomId', 'ownerId'],
        dataSource: [
          { text: 'Install New Database', roomId: 1, ownerId: 1, startDate: new Date(2018, 4, 14, 9), endDate: new Date(2018, 4, 14, 11) },
          { text: 'Website Re-Design Plan', roomId: 1, ownerId: 1, startDate: new Date(2018, 4, 15, 9, 30), endDate: new Date(2018, 4, 15, 11, 30) },
          { text: 'Book Flights to San Fran', roomId: 1, ownerId: 1, startDate: new Date(2018, 4, 16, 12), endDate: new Date(2018, 4, 16, 13) },
          { text: 'Upgrade Personal Computers', roomId: 1, ownerId: 2, startDate: new Date(2018, 4, 15, 10), endDate: new Date(2018, 4, 15, 11, 30) },
          { text: 'Customer Workshop', roomId: 2, ownerId: 1, startDate: new Date(2018, 4, 16, 11), endDate: new Date(2018, 4, 16, 12) },
        ],
        resources: [{
          fieldExpr: 'roomId',
          dataSource: [
            { id: 1, text: 'Conference Room 101', color: '#56ca85' },
            { id: 2, text: 'Room 102', color: '#ff9747' },
          ],
          label: 'Room',
        }, {
          fieldExpr: 'ownerId',
          dataSource: [
            { id: 1, text: 'Alex', color: '#727bd2' },
            { id: 2, text: 'Samantha', color: '#32c9ed' },
          ],
          label: 'Owner',
        }],
      });
    });
  </script>
</body>
</html>
