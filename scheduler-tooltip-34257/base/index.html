<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BASE (before PR — commit a88c55a4)</title>
  <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/26.1.3/css/dx.fluent.blue.light.css">
  <script src="dx.all.js"></script>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 12px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .header h3 { margin: 0; }
    .badge { padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; color: #fff; background: #2e7d32; }
    #status { margin: 8px 0; font-size: 13px; min-height: 34px; color: #555; }
    #status.updated { color: #0b6a0b; font-weight: 600; }
    button.step { font-size: 14px; padding: 6px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">BASE (before PR — commit a88c55a4)</span>
    <button id="update" class="step">1. Change hidden appointment: end 9:00 → 8:30 AM</button>
  </div>
  <div id="status">2. Then click the “2” collector button and check the time shown for Appointment 2.</div>
  <div id="scheduler"></div>
  <script>
    var dataSource = [
      { text: 'Appointment 1', startDate: new Date(2015, 1, 9, 8), endDate: new Date(2015, 1, 9, 9) },
      { text: 'Appointment 2', startDate: new Date(2015, 1, 9, 8), endDate: new Date(2015, 1, 9, 9) },
      { text: 'Appointment 3', startDate: new Date(2015, 1, 9, 8), endDate: new Date(2015, 1, 9, 9) },
    ];

    var scheduler = new DevExpress.ui.dxScheduler(document.getElementById('scheduler'), {
      dataSource: dataSource,
      views: ['day'],
      currentView: 'day',
      currentDate: new Date(2015, 1, 9),
      startDayHour: 7,
      endDayHour: 10,
      maxAppointmentsPerCell: 1,
      editing: true,
      height: 430,
      _newAppointments: true,
    });

    document.getElementById('update').addEventListener('click', function () {
      scheduler.updateAppointment(dataSource[1], {
        text: 'Appointment 2',
        startDate: new Date(2015, 1, 9, 8),
        endDate: new Date(2015, 1, 9, 8, 30),
      });

      var status = document.getElementById('status');
      status.textContent = 'Appointment 2 now ends at 8:30 AM. Click the “2” collector button — the tooltip must show “8:00 AM - 8:30 AM”.';
      status.className = 'updated';
      this.disabled = true;
    });
  </script>
</body>
</html>
