<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    const cssSide = new URLSearchParams(location.search).get('side') === 'base' ? 'base' : 'head';
    document.write('<link rel="stylesheet" href="css/' + cssSide + '.css">');
  </script>
  <style>
    body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
    #scheduler { height: 460px; }
  </style>
</head>
<body>
  <div id="scheduler"></div>

  <script src="fixed/dx.all.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const side = params.get('side') === 'base' ? 'base' : 'head';
    const scenario = params.get('scenario') || 'hier';

    const flatRooms = [
      { id: 1, text: 'Room 1' },
      { id: 2, text: 'Room 2' },
    ];

    // Three levels: A -> B1(C1,C2), B2(C3,C4). C3 is the leaf that loses its right border.
    const hierRegions = [
      { id: 1, parentId: null, text: 'A' },
      { id: 2, parentId: 1, text: 'B1' },
      { id: 3, parentId: 1, text: 'B2' },
      { id: 4, parentId: 2, text: 'C1' },
      { id: 5, parentId: 2, text: 'C2' },
      { id: 6, parentId: 3, text: 'C3' },
      { id: 7, parentId: 3, text: 'C4' },
    ];

    const appointments = [
      { text: 'Meeting', startDate: new Date(2021, 3, 26, 10), endDate: new Date(2021, 3, 26, 12), roomId: 1, regionId: 4 },
      { text: 'Review', startDate: new Date(2021, 3, 26, 13), endDate: new Date(2021, 3, 26, 15), roomId: 2, regionId: 6 },
    ];

    const scenarios = {
      hier: {
        currentView: 'timelineDay',
        views: ['timelineDay'],
        groups: ['regionId'],
        resources: [{ fieldExpr: 'regionId', dataSource: hierRegions, parentIdExpr: 'parentId', label: 'Region' }],
      },
      flat: {
        currentView: 'timelineDay',
        views: ['timelineDay'],
        groups: ['roomId'],
        resources: [{ fieldExpr: 'roomId', dataSource: flatRooms, label: 'Room' }],
      },
      rtl: {
        rtlEnabled: true,
        currentView: 'timelineDay',
        views: ['timelineDay'],
        groups: ['roomId'],
        resources: [{ fieldExpr: 'roomId', dataSource: flatRooms, label: 'Room' }],
      },
      week: {
        currentView: 'week',
        views: ['week'],
        groups: ['roomId'],
        resources: [{ fieldExpr: 'roomId', dataSource: flatRooms, label: 'Room' }],
      },
      agenda: {
        currentView: 'agenda',
        views: ['agenda'],
        groups: ['roomId'],
        resources: [{ fieldExpr: 'roomId', dataSource: flatRooms, label: 'Room' }],
      },
      dayNoAllDay: {
        currentView: 'day',
        views: ['day'],
        showAllDayPanel: false,
        groups: ['roomId'],
        resources: [{ fieldExpr: 'roomId', dataSource: flatRooms, label: 'Room' }],
      },
      dayAllDay: {
        currentView: 'day',
        views: ['day'],
        showAllDayPanel: true,
        groups: ['roomId'],
        resources: [{ fieldExpr: 'roomId', dataSource: flatRooms, label: 'Room' }],
      },
    };

    const config = Object.assign({
      dataSource: appointments,
      currentDate: new Date(2021, 3, 26),
      height: 460,
      startDayHour: 9,
      endDayHour: 16,
      groupOrientation: 'vertical',
    }, scenarios[scenario]);

    const instance = new DevExpress.ui.dxScheduler(document.getElementById('scheduler'), config);

    // The base frame runs the SAME JS as the PR frame — only the stylesheet differs.
    // This PR deleted the code that put dx-scheduler-group-column-count-* on the workspace,
    // so for the base stylesheet to behave as it did before the PR, the class is re-added here.
    if (side === 'base' && (scenario === 'flat' || scenario === 'rtl')) {
      // The widget re-renders its workspace asynchronously, so keep re-applying the class.
      const reapply = () => {
        document.querySelectorAll('.dx-scheduler-work-space').forEach((ws) => {
          ws.classList.add('dx-scheduler-group-column-count-two');
        });
      };
      reapply();
      new MutationObserver(reapply).observe(document.getElementById('scheduler'), { childList: true, subtree: true });
      setTimeout(reapply, 300);
      setTimeout(reapply, 1000);
    }
  </script>
</body>
</html>
