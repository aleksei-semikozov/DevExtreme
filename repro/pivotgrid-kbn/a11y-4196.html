<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PivotGrid — Accessibility test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="dx.fluent.blue.light.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="dx.all.debug.js"></script>
  <script src="data.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; max-width: 1100px; margin: 0 auto; color: #1f2328; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 20px; }
  </style>
</head>
<body>
  <h1>PivotGrid — Accessibility test</h1>
  <div id="pivotgrid"></div>

  <script>
    $(function () {
      $('#pivotgrid').dxPivotGrid({
        width: 1000,
        allowSorting: true,
        allowSortingBySummary: true,
        allowFiltering: true,
        allowExpandAll: true,
        showBorders: true,
        fieldPanel: { visible: true },
        fieldChooser: { enabled: true, height: 500 },
        scrolling: { mode: 'standard' },
        dataSource: {
          fields: [
            { dataField: 'country', area: 'filter' },
            { caption: 'Region', dataField: 'region', area: 'row' },
            { caption: 'City', dataField: 'city', area: 'row' },
            { dataField: 'country', caption: 'Country', area: 'column' },
            { dataField: 'date', dataType: 'date', area: 'column' },
            { caption: 'Sales', dataField: 'amount', dataType: 'number', summaryType: 'sum', area: 'data' },
          ],
          store: sales,
        },
      });
    });
  </script>
</body>
</html>
